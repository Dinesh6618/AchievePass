# Supabase CLI configuration for local development (`supabase start`).
# A hosted project does NOT read this file — mirror these settings in the dashboard (see README → Sign-in model).
project_id = "certipass"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
# No e-mail links anywhere (everyone signs in with a username), so no redirect URLs are needed.
additional_redirect_urls = []
enable_signup = true

[auth.email]
enable_signup = true
# CertiPass has NO e-mail verification: students, faculty and admins all sign in with a username (their Auth identity
# is an internal, never-delivered address), so a confirmation message could not be received. Keep this off.
enable_confirmations = false

[storage]
enabled = true

[functions.admin-create-user]
verify_jwt = true
